# /standalone-complex/Cargo.toml
[workspace]
members = [
    "crates/tsc-crypto",
    "crates/tsc-proto",
    "crates/tsc-net",
    "crates/tsc-runtime",
    "crates/tscd",
    "crates/tsc-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Anonymous Lead Engineer"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Core Cryptography (RustCrypto)
blake3            = "1.5"
ed25519-dalek     = { version = "2.1", features = ["rand_core", "zeroize"] }
x25519-dalek      = { version = "2.0", features = ["zeroize"] }
chacha20poly1305  = "0.10"
argon2            = { version = "0.5", features = ["password-hash"] }
hkdf              = "0.12"
sha2              = "0.10"
hmac              = "0.12"
zeroize           = { version = "1.7", features = ["derive"] }
rand              = "0.8"
hex               = "0.4"
aes-gcm           = "0.10"

# BIP-39 / Key derivation
bip39             = { version = "2.0", features = ["rand"] }

# Serialization
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
bincode           = "1.3"

# Async & Networking
tokio             = { version = "1.35", features = ["full"] }
quinn             = "0.10"
rustls            = { version = "0.21", features = ["quic", "dangerous_configuration"] }
rcgen             = "0.11"

# P2P
libp2p            = { version = "0.53", features = ["tcp", "tls", "dns", "tokio", "noise", "yamux", "kad", "mdns", "macros"] }

# System
nix               = { version = "0.27", features = ["user", "socket", "fs"] }
dirs              = "5.0"

# Utilities
thiserror         = "1.0"