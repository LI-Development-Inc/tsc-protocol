[package]
name = "tsc-net"
version.workspace = true
edition.workspace = true
description = "Transport Domain (The Pipe) for the Standalone Complex"

[features]
# Enables self-signed TLS cert acceptance for local development.
# MUST NOT be enabled in production builds. See ADR-008.
dev = []

[dependencies]
tsc-crypto = { path = "../tsc-crypto" }

# Networking
quinn   = { workspace = true }
tokio   = { workspace = true }
rustls  = { workspace = true }
rcgen   = { workspace = true }

# P2P
libp2p  = { workspace = true }

# Crypto
aes-gcm       = { workspace = true }
blake3        = { workspace = true }
ed25519-dalek = { workspace = true }
hex           = { workspace = true }

# Serialization
bincode = { workspace = true }
serde   = { workspace = true }

# Randomness
rand = { workspace = true }
