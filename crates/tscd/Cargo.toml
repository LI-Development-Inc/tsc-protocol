[package]
name = "tscd"
version.workspace = true
edition.workspace = true

[dependencies]
# TSC Workspace Crates
tsc-crypto = { path = "../tsc-crypto" }
tsc-net = { path = "../tsc-net" }
tsc-runtime = { path = "../tsc-runtime" }

# Orchestration & CLI
tokio = { workspace = true, features = ["full"] }
clap = { version = "4.4", features = ["derive"] } # CLI parsing
ctrlc = "3.4" # Graceful shutdown logic

# IPC
nix = { version = "0.27", features = ["user", "socket", "fs"] }
libc = "0.2"

serde = { workspace = true, features = ["derive"] }
bincode = "1.3"
ed25519-dalek = "2.0"
rand = "0.8"