[package]
name = "tscd"
version.workspace = true
edition.workspace = true
description = "The Shell — TSC privileged daemon"

[dependencies]
# TSC crates
tsc-crypto  = { path = "../tsc-crypto" }
tsc-net     = { path = "../tsc-net" }
tsc-runtime = { path = "../tsc-runtime" }
tsc-proto   = { path = "../tsc-proto" }

# Async runtime
tokio = { workspace = true }

# IPC peer auth
nix = { workspace = true }

# Key derivation helpers (for DHT key)
hkdf  = { workspace = true }
sha2  = { workspace = true }

# Path resolution
dirs  = { workspace = true }

# Key material
ed25519-dalek = { workspace = true }
blake3        = { workspace = true }
hex           = { workspace = true }
rand          = { workspace = true }
